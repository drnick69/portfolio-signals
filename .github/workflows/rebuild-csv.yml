name: Rebuild signals.csv

# Manual trigger only. Rebuilds docs/history/signals.csv from
# docs/history/daily-log.jsonl under the CURRENT log-signals header (read from
# .github/scripts/log-signals.mjs at run time) and commits the result.
#
# Don't start it while the daily signal run is in progress: both write
# signals.csv. Run it when log-signals logs "CSV header mismatch that is NOT a pure append"
# or signal-accuracy logs "CSV SCHEMA MISMATCH: skipped N rows". The step log
# carries a reconciliation report: columns whose values differ between the old
# and rebuilt file are listed — read it before relying on the rebuild.
#
# Backups committed alongside:
#   signals.csv.pre-rebuild.bak   the very first pre-rebuild state (June 2026),
#                                 never overwritten
#   signals.csv.last-rebuild.bak  the file as it stood just before THIS run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild signals.csv from daily-log.jsonl
        run: node .github/scripts/rebuild-signals-csv.mjs

      - name: Commit rebuilt CSV + backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/history/signals.csv docs/history/signals.csv.last-rebuild.bak
          [ -f docs/history/signals.csv.pre-rebuild.bak ] && git add docs/history/signals.csv.pre-rebuild.bak
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Rebuild signals.csv from daily-log.jsonl under the current log-signals header"
          git push
